CONFIG_FIDO2=y
CONFIG_FIDO2_TRANSPORT_BLE=y
CONFIG_FIDO2_AAGUID="25497c3c8433453eacfc9dd2c04e8e15"
CONFIG_FIDO2_BLE_REQUIRE_AUTHENTICATED_LINK=y
CONFIG_FIDO2_UP_CUSTOM=y
CONFIG_FIDO2_LOG_LEVEL_INF=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_BONDING_REQUIRED=y
# Keep bonds for five PCs; a sixth must not silently evict an existing PC.
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_MAX_CONN=1
CONFIG_BT_KEYS_OVERWRITE_OLDEST=n
CONFIG_BT_USER_CONN_PARAM_REJECTED=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_MANUF_NAME_STR="DIY FIDO"
CONFIG_BT_DIS_MODEL_NUMBER_STR="ESP32-C3 OLED"
CONFIG_BT_DIS_FW_REV_STR="0.1"
CONFIG_BT_DEVICE_NAME="DIY FIDO C3"
CONFIG_BT_RX_STACK_SIZE=3072
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SECURE_STORAGE_ITS_MAX_DATA_SIZE=1024
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_I2C=y
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Crypto and controller tasks need headroom on the ESP32-C3 port.
CONFIG_FIDO2_THREAD_STACK_SIZE=8192
CONFIG_ESP32_BT_CONTROLLER_STACK_SIZE=8192
CONFIG_STACK_SENTINEL=y
CONFIG_INIT_STACKS=y
CONFIG_LOG_BUFFER_SIZE=4096

CONFIG_REBOOT=y
